# CONTROL: same phased load straight to the backend (port 4005 tunnel), skipping Boomi.
test_plan: rest/ramp.jmx
step_duration_sec: 40
warmup_sec: 8
think_time_ms: 200
stop_rule:
  max_error_rate_pct: 5
  max_avg_response_ms: 3000
target:
  protocol: http
  host: host.docker.internal
  port: 4005
  auth: none
requests:
- name: List customers
  method: GET
  path: /customers
  extract: id=$[0].customer_id
- name: Get customer
  method: GET
  path: /customers/${id}
steps:
- instances: 1
  threads: 4
  rps: 10
- instances: 1
  threads: 8
  rps: 20
- instances: 1
  threads: 16
  rps: 40
- instances: 1
  threads: 32
  rps: 80
- instances: 1
  threads: 8
  rps: 20
- instances: 1
  threads: 4
  rps: 10
