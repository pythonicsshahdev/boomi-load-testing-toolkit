networks:
  perf-test-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:
  jmeter:
    build:
      context: ./jmeter
    image: boomi-jmeter:dev
    networks:
      - perf-test-net
    volumes:
      - ./test-plans:/test-plans
    env_file:
      - path: .env
        required: false
    profiles: ["tools"]

  jmeter-gui:
    build:
      context: ./jmeter-gui
    image: boomi-jmeter-gui:dev
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./test-plans:/test-plans
    env_file:
      - path: .env
        required: false

  prometheus:
    image: prom/prometheus:latest
    networks:
      - perf-test-net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    build:
      context: ./grafana
    image: boomi-grafana:dev
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  rest-target:
    image: pythonicshahdev/fastapi-commercial-source:latest
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:8010:4005"

  graphql-target:
    build:
      context: ./sample-services/graphql-strawberry
    image: boomi-graphql-target:dev
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:8011:8001"
