networks:
  perf-test-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:
  jmeter:
    build:
      context: ./jmeter
    image: boomi-jmeter:dev
    networks:
      - perf-test-net
    volumes:
      - ./test-plans:/test-plans
    env_file:
      - path: .env
        required: false
    profiles: ["tools"]

  # Identical to jmeter, but under its own service name/alias. ramp.py's
  # launch_instance() uses --use-aliases (required for Prometheus's
  # file-based discovery of its deterministic container name), which also
  # registers the container under this service's own alias. If ramp
  # instances ran under the "jmeter" service itself, that alias would
  # collide with the base project's static `jmeter:9270` scrape target,
  # and Prometheus's DNS round-robin between whichever ramp container
  # happened to be up would corrupt that job's counter with a
  # non-monotonic, unattributable series (no run_id/step_id labels).
  # A separate service name keeps the two scrape jobs permanently distinct.
  jmeter-ramp:
    build:
      context: ./jmeter
    image: boomi-jmeter:dev
    networks:
      - perf-test-net
    volumes:
      - ./test-plans:/test-plans
    env_file:
      - path: .env
        required: false
    profiles: ["tools"]

  jmeter-gui:
    build:
      context: ./jmeter-gui
    image: boomi-jmeter-gui:dev
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./test-plans:/test-plans
    env_file:
      - path: .env
        required: false

  prometheus:
    image: prom/prometheus:latest
    networks:
      - perf-test-net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - ./prometheus/targets:/etc/prometheus/targets:ro

    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    build:
      context: ./grafana
    image: boomi-grafana:dev
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  rest-target:
    image: pythonicshahdev/fastapi-commercial-source:latest
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:8010:4005"

  graphql-target:
    build:
      context: ./sample-services/graphql-strawberry
    image: boomi-graphql-target:dev
    networks:
      - perf-test-net
    ports:
      - "127.0.0.1:8011:8001"
