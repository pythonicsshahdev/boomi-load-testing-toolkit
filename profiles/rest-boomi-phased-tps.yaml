# Phased load in TPS terms: 10 > 20 > 40 > 80 > 20 > 10 transactions/sec through the Boomi API.
# One transaction = one pass through the flow (list customers, then get that customer) = 2 HTTP requests,
# so the 80 TPS peak is 160 req/s. Threads are sized so each can sustain its share (~2.3 TPS/thread at 200 ms think time).
# First run: ./ramp.sh --save-baseline <this file>.
test_plan: rest/ramp.jmx
step_duration_sec: 40
warmup_sec: 8
think_time_ms: 200
stop_rule:
  max_error_rate_pct: 5
  max_avg_response_ms: 3000
regression:
  baseline: boomi-phased-tps
  max_p95_increase_pct: 30
  max_error_rate_increase_pct: 1
  min_p95_delta_ms: 25
target:
  protocol: http
  host: host.docker.internal   # this machine, as seen from inside the container (never localhost)
  port: 8078
  auth: api_key
requests:
- name: List customers
  method: GET
  path: /ws/rest/proxy/v1/customers
  extract: id=$[0].customer_id
- name: Get customer
  method: GET
  path: /ws/rest/proxy/v1/customers/${id}
steps:
- instances: 1
  threads: 8
  tps: 10
- instances: 1
  threads: 14
  tps: 20
- instances: 1
  threads: 26
  tps: 40
- instances: 1
  threads: 50
  tps: 80
- instances: 1
  threads: 14
  tps: 20
- instances: 1
  threads: 8
  tps: 10
