# Boomi-published customers API on the local Atom (localhost:8078 on the Mac).
# From inside the JMeter container the Mac is host.docker.internal, not localhost.
# API key comes from .env (BOOMI_TEST_TARGET_API_KEY), sent as x-api-key.
test_plan: rest/ramp.jmx
step_duration_sec: 30
warmup_sec: 5
think_time_ms: 200
stop_rule:
  max_error_rate_pct: 2
  max_avg_response_ms: 3000
regression:
  baseline: boomi-local-customers
  max_p95_increase_pct: 30
  max_error_rate_increase_pct: 1
  min_p95_delta_ms: 25
target:
  protocol: http
  host: host.docker.internal
  port: 8078
  auth: api_key
requests:
  - name: "List customers"
    method: GET
    path: "/ws/rest/proxy/v1/customers"
    extract: "id=$[0].customer_id"
  - name: "Get customer"
    method: GET
    path: "/ws/rest/proxy/v1/customers/${id}"
steps:
  - instances: 1
    threads: 3
    rps: 5
